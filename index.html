                        const parts = paragraph.split('**');
                        const elements = [];
                        for (let i = 0; i < parts.length; i++) {
                            if (i % 2 === 0) {
                                elements.push(<span key={i}>{parts[i]}</span>);
                            } else {
                                elements.push(<strong key={i}>{parts[i]}</strong>);
                            }
                        }
                        return <p key={pIndex}>{elements}</p>;
                    }
                    
                    // Check for italic text (*text*)
                    else if (paragraph.includes('*') && !paragraph.startsWith('* ')) {
                        const parts = paragraph.split('*');
                        const elements = [];
                        for (let i = 0; i < parts.length; i++) {
                            if (i % 2 === 0) {
                                elements.push(<span key={i}>{parts[i]}</span>);
                            } else {
                                elements.push(<em key={i}>{parts[i]}</em>);
                            }
                        }
                        return <p key={pIndex}>{elements}</p>;
                    }
                    
                    // Regular paragraph
                    else {
                        return <p key={pIndex}>{paragraph}</p>;
                    }
                });
            };

            return (
                <div className="container">
                    {showIntro ? (
                        <div className="intro-page">
                            <h1 className="intro-title">{course.title}</h1>
                            <p>Welcome to the KCSE Biology Training course on Ecology. This course covers all essential ecology topics for the Kenya Certificate of Secondary Education examination.</p>
                            
                            <div className="intro-section">
                                <h3>Course Overview</h3>
                                <p>This course is structured into {course.modules.length} modules covering:</p>
                                <ul>
                                    {course.modules.map((module, index) => (
                                        <li key={index}>
                                            <strong>{module.title}</strong> - {module.lessons.length} lessons
                                        </li>
                                    ))}
                                </ul>
                            </div>
                            
                            <div className="feature-grid">
                                <div className="feature-card">
                                    <div className="feature-icon">📚</div>
                                    <h3>Comprehensive Content</h3>
                                    <p>Structured lessons covering all essential KCSE ecology topics</p>
                                </div>
                                <div className="feature-card">
                                    <div className="feature-icon">🎯</div>
                                    <h3>Interactive Quizzes</h3>
                                    <p>Test your knowledge with timed quizzes and instant feedback</p>
                                </div>
                                <div className="feature-card">
                                    <div className="feature-icon">🔊</div>
                                    <h3>Audio Learning</h3>
                                    <p>Listen to lessons with integrated audio player and transcripts</p>
                                </div>
                                <div className="feature-card">
                                    <div className="feature-icon">📊</div>
                                    <h3>Progress Tracking</h3>
                                    <p>Monitor your progress and review quiz history</p>
                                </div>
                            </div>
                            
                            <button className="btn btn-primary btn-large" onClick={startCourse}>
                                Start Learning
                            </button>
                        </div>
                    ) : (
                        <>
                            <div className="mobile-header">
                                <h2>{course.title}</h2>
                                <button className="mobile-menu-btn" onClick={toggleSidebar}>
                                    ☰
                                </button>
                            </div>
                            
                            <div className="header">
                                <h2>{currentModuleData.title} - {currentLessonData.title}</h2>
                                <div className="progress-bar">
                                    <div className="progress-fill" style={{ width: `${calculateProgress()}%` }}></div>
                                </div>
                                <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: '5px' }}>
                                    <span>Progress: {calculateProgress()}%</span>
                                    {currentLessonData.type === 'quiz' && timeLeft !== null && (
                                        <div>
                                            <span>Time remaining: </span>
                                            <span className={`timer ${timeLeft < 60 ? 'warning' : ''}`}>
                                                {formatTime(timeLeft)}
                                            </span>
                                        </div>
                                    )}
                                </div>
                            </div>
                            
                            <div className="main-layout">
                                <div className={`sidebar ${sidebarOpen ? 'open' : ''}`}>
                                    <h3>Course Modules</h3>
                                    {course.modules.map((module, moduleIndex) => (
                                        <div key={moduleIndex}>
                                            <h4 style={{ marginTop: '15px', marginBottom: '5px' }}>{module.title}</h4>
                                            {module.lessons.map((lesson, lessonIndex) => {
                                                const lessonKey = `${moduleIndex}-${lessonIndex}`;
                                                const isCompleted = completedLessons.has(lessonKey);
                                                const isActive = moduleIndex === currentModule && lessonIndex === currentLesson;
                                                
                                                return (
                                                    <div 
                                                        key={lessonIndex}
                                                        className={`lesson-item ${isActive ? 'active' : ''}`}
                                                        onClick={() => {
                                                            setCurrentModule(moduleIndex);
                                                            setCurrentLesson(lessonIndex);
                                                            setShowResults(false);
                                                            setEditMode(false);
                                                            setSidebarOpen(false);
                                                        }}
                                                    >
                                                        <span style={{ marginRight: '10px' }}>
                                                            {isCompleted ? '✅' : lesson.type === 'quiz' ? '❓' : '📖'}
                                                        </span>
                                                        {lesson.title}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    ))}
                                </div>
                                
                                <div className="content">
                                    {currentLessonData.type === 'content' ? (
                                        <div className="lesson-content">
                                            <div className="edit-controls">
                                                <button 
                                                    className={`btn ${editMode ? 'btn-save' : 'btn-edit'}`}
                                                    onClick={editMode ? saveContent : toggleEditMode}
                                                >
                                                    {editMode ? 'Save Changes' : 'Edit Content'}
                                                </button>
                                                {editMode && (
                                                    <button className="btn btn-cancel" onClick={cancelEdit}>
                                                        Cancel
                                                    </button>
                                                )}
                                            </div>
                                            
                                            {editMode ? (
                                                <div className="edit-section">
                                                    <h4>Edit Lesson</h4>
                                                    <div className="edit-input-group">
                                                        <label>Lesson Title:</label>
                                                        <input 
                                                            type="text" 
                                                            className="edit-input"
                                                            value={currentLessonData.title}
                                                            onChange={updateLessonTitle}
                                                        />
                                                    </div>
                                                    <div className="edit-input-group">
                                                        <label>Lesson Content:</label>
                                                        <textarea 
                                                            className="edit-textarea"
                                                            value={currentLessonData.content}
                                                            onChange={updateLessonContent}
                                                        />
                                                    </div>
                                                </div>
                                            ) : (
                                                <div>
                                                    {renderContent(currentLessonData.content)}
                                                    
                                                    {/* Simplified Audio Button */}
                                                    <div className="audio-button-container">
                                                        <div className="audio-upload">
                                                            <label htmlFor={`audio-upload-${lessonKey}`} className="upload-btn">
                                                                Upload Audio
                                                            </label>
                                                            <input 
                                                                id={`audio-upload-${lessonKey}`}
                                                                type="file" 
                                                                className="file-input"
                                                                accept="audio/*"
                                                                onChange={handleFileUpload}
                                                            />
                                                            {audioData[lessonKey] && audioData[lessonKey].url && (
                                                                <span className="audio-info">Audio file uploaded</span>
                                                            )}
                                                        </div>
                                                        
                                                        {audioData[lessonKey] && audioData[lessonKey].url && (
                                                            <>
                                                                <audio ref={audioRef} src={audioData[lessonKey].url} />
                                                                <button 
                                                                    className={`btn btn-audio ${isPlaying ? 'audio-playing' : ''}`}
                                                                    onClick={togglePlay}
                                                                >
                                                                    {isPlaying ? (
                                                                        <>
                                                                            <span>⏸️</span>
                                                                            <span>Pause</span>
                                                                        </>
                                                                    ) : (
                                                                        <>
                                                                            <span>▶️</span>
                                                                            <span>Listen to Lesson</span>
                                                                        </>
                                                                    )}
                                                                </button>
                                                                <div className={`audio-status ${isPlaying ? 'audio-playing' : ''}`}>
                                                                    {isPlaying ? 'Playing audio...' : 'Click to listen'}
                                                                </div>
                                                            </>
                                                        )}
                                                    </div>
                                                    
                                                    {/* Transcript Display */}
                                                    {audioData[lessonKey] && audioData[lessonKey].transcript && audioData[lessonKey].transcript.length > 0 && (
                                                        <div className="transcript-container">
                                                            <div className="transcript-header">
                                                                <h4>Transcript</h4>
                                                                <button className="btn btn-secondary" onClick={toggleTranscript}>
                                                                    {showTranscript ? 'Hide' : 'Show'}
                                                                </button>
                                                            </div>
                                                            
                                                            {showTranscript && (
                                                                <div className="transcript-text">
                                                                    {audioData[lessonKey].transcript.map((line, index) => (
                                                                        <p key={index} className={index === currentTranscriptIndex ? 'transcript-current' : ''}>
                                                                            {line}
                                                                        </p>
                                                                    ))}
                                                                </div>
                                                            )}
                                                        </div>
                                                    )}
                                                </div>
                                            )}
                                            
                                            <div className="navigation">
                                                <button 
                                                    className="btn btn-secondary" 
                                                    onClick={handlePrevious}
                                                    disabled={currentModule === 0 && currentLesson === 0}
                                                >
                                                    Previous
                                                </button>
                                                
                                                <button 
                                                    className="btn btn-primary" 
                                                    onClick={handleComplete}
                                                >
                                                    {isLastLesson ? 'Finish Course' : 'Mark Complete & Continue'}
                                                </button>
                                                
                                                <button 
                                                    className="btn btn-secondary" 
                                                    onClick={handleNext}
                                                    disabled={isLastLesson}
                                                >
                                                    Next
                                                </button>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="lesson-content">
                                            <h3>{currentLessonData.title}</h3>
                                            
                                            {editMode ? (
                                                <div className="edit-section">
                                                    <h4>Edit Quiz</h4>
                                                    
                                                    <div className="edit-input-group">
                                                        <label>Quiz Title:</label>
                                                        <input 
                                                            type="text" 
                                                            className="edit-input"
                                                            value={currentLessonData.title}
                                                            onChange={updateLessonTitle}
                                                        />
                                                    </div>
                                                    
                                                    <div className="edit-input-group">
                                                        <label>Timer (seconds):</label>
                                                        <input 
                                                            type="number" 
                                                            className="edit-input"
                                                            value={currentLessonData.timer}
                                                            onChange={updateQuizTimer}
                                                        />
                                                    </div>
                                                    
                                                    <div>
                                                        <h4>Questions:</h4>
                                                        {currentLessonData.questions.map((question, qIndex) => (
                                                            <div key={qIndex} className="edit-section">
                                                                <h4>Question {qIndex + 1}</h4>
                                                                
                                                                <div className="edit-input-group">
                                                                    <label>Question Text:</label>
                                                                    <input 
                                                                        type="text" 
                                                                        className="edit-input"
                                                                        value={question.q}
                                                                        onChange={(e) => updateQuestionText(qIndex, e)}
                                                                    />
                                                                </div>
                                                                
                                                                <div className="edit-input-group">
                                                                    <label>Question Type:</label>
                                                                    <select 
                                                                        className="edit-select"
                                                                        value={question.type}
                                                                        onChange={(e) => updateQuestionType(qIndex, e)}
                                                                    >
                                                                        <option value="multiple">Multiple Choice</option>
                                                                        <option value="truefalse">True/False</option>
                                                                        <option value="fillblank">Fill in the Blank</option>
                                                                    </select>
                                                                </div>
                                                                
                                                                {question.type === 'multiple' && (
                                                                    <div>
                                                                        <h4>Options:</h4>
                                                                        {question.options.map((option, optIndex) => (
                                                                            <div key={optIndex} className="edit-option">
                                                                                <input 
                                                                                    type="text" 
                                                                                    value={option}
                                                                                    onChange={(e) => updateQuestionOption(qIndex, optIndex, e)}
                                                                                />
                                                                                <button onClick={() => removeQuestionOption(qIndex, optIndex)}>
                                                                                    Remove
                                                                                </button>
                                                                            </div>
                                                                        ))}
                                                                        <button className="add-option" onClick={() => addQuestionOption(qIndex)}>
                                                                            Add Option
                                                                        </button>
                                                                        
                                                                        <div className="edit-input-group">
                                                                            <label>Correct Answer Index:</label>
                                                                            <input 
                                                                                type="number" 
                                                                                className="edit-input"
                                                                                value={question.correct}
                                                                                onChange={(e) => updateQuestionCorrect(qIndex, parseInt(e.target.value))}
                                                                            />
                                                                        </div>
                                                                    </div>
                                                                )}
                                                                
                                                                {question.type === 'truefalse' && (
                                                                    <div className="edit-input-group">
                                                                        <label>Correct Answer:</label>
                                                                        <select 
                                                                            className="edit-select"
                                                                            value={question.correct}
                                                                            onChange={(e) => updateQuestionCorrect(qIndex, e.target.value === 'true')}
                                                                        >
                                                                            <option value={true}>True</option>
                                                                            <option value={false}>False</option>
                                                                        </select>
                                                                    </div>
                                                                )}
                                                                
                                                                {question.type === 'fillblank' && (
                                                                    <>
                                                                        <div className="edit-input-group">
                                                                            <label>Correct Answer:</label>
                                                                            <input 
                                                                                type="text" 
                                                                                className="edit-input"
                                                                                value={question.correct}
                                                                                onChange={(e) => updateQuestionFillBlank(qIndex, e)}
                                                                            />
                                                                        </div>
                                                                        
                                                                        <div className="edit-input-group">
                                                                            <label>Alternative Answers (comma-separated):</label>
                                                                            <input 
                                                                                type="text" 
                                                                                className="edit-input"
                                                                                value={question.alternatives ? question.alternatives.join(', ') : ''}
                                                                                onChange={(e) => updateQuestionAlternatives(qIndex, e)}
                                                                            />
                                                                        </div>
                                                                    </>
                                                                )}
                                                                
                                                                <div className="edit-input-group">
                                                                    <label>Explanation:</label>
                                                                    <textarea 
                                                                        className="edit-textarea"
                                                                        value={question.explanation}
                                                                        onChange={(e) => updateQuestionExplanation(qIndex, e)}
                                                                    />
                                                                </div>
                                                                
                                                                <button 
                                                                    className="btn btn-cancel" 
                                                                    onClick={() => removeQuizQuestion(qIndex)}
                                                                >
                                                                    Remove Question
                                                                </button>
                                                            </div>
                                                        ))}
                                                        
                                                        <button className="add-option" onClick={addQuizQuestion}>
                                                            Add Question
                                                        </button>
                                                    </div>
                                                </div>
                                            ) : (
                                                <div>
                                                    {!showResults ? (
                                                        <div>
                                                            {currentLessonData.questions.map((question, qIndex) => (
                                                                <div key={qIndex} className="quiz-question">
                                                                    <p><strong>Question {qIndex + 1}:</strong> {question.q}</p>
                                                                    
                                                                    {question.type === 'multiple' && (
                                                                        <div className="quiz-options-grid">
                                                                            {question.options.map((option, optIndex) => (
                                                                                <button
                                                                                    key={optIndex}
                                                                                    className={`quiz-option ${quizAnswers[`${lessonKey}-${qIndex}`] === optIndex ? 'selected' : ''}`}
                                                                                    onClick={() => handleQuizAnswer(qIndex, optIndex)}
                                                                                >
                                                                                    {option}
                                                                                </button>
                                                                            ))}
                                                                        </div>
                                                                    )}
                                                                    
                                                                    {question.type === 'truefalse' && (
                                                                        <div className="true-false-container">
                                                                            <button
                                                                                className={`quiz-option ${quizAnswers[`${lessonKey}-${qIndex}`] === true ? 'selected' : ''}`}
                                                                                onClick={() => handleQuizAnswer(qIndex, true)}
                                                                            >
                                                                                True
                                                                            </button>
                                                                            <button
                                                                                className={`quiz-option ${quizAnswers[`${lessonKey}-${qIndex}`] === false ? 'selected' : ''}`}
                                                                                onClick={() => handleQuizAnswer(qIndex, false)}
                                                                            >
                                                                                False
                                                                            </button>
                                                                        </div>
                                                                    )}
                                                                    
                                                                    {question.type === 'fillblank' && (
                                                                        <div>
                                                                            <input
                                                                                type="text"
                                                                                className="fill-blank"
                                                                                placeholder="Type your answer here"
                                                                                value={quizAnswers[`${lessonKey}-${qIndex}`] || ''}
                                                                                onChange={(e) => handleFillBlankAnswer(qIndex, e.target.value)}
                                                                            />
                                                                        </div>
                                                                    )}
                                                                </div>
                                                            ))}
                                                            
                                                            <div className="navigation">
                                                                <button 
                                                                    className="btn btn-secondary" 
                                                                    onClick={handlePrevious}
                                                                    disabled={currentModule === 0 && currentLesson === 0}
                                                                >
                                                                    Previous
                                                                </button>
                                                                
                                                                <button 
                                                                    className="btn btn-primary" 
                                                                    onClick={submitQuiz}
                                                                >
                                                                    Submit Quiz
                                                                </button>
                                                                
                                                                <button 
                                                                    className="btn btn-secondary" 
                                                                    onClick={() => setShowHistoryModal(true)}
                                                                >
                                                                    View History
                                                                </button>
                                                            </div>
                                                        </div>
                                                    ) : (
                                                        <div>
                                                            <h3>Quiz Results</h3>
                                                            
                                                            {currentLessonData.questions.map((question, qIndex) => {
                                                                const userAnswer = quizAnswers[`${lessonKey}-${qIndex}`];
                                                                let isCorrect = false;
                                                                
                                                                if (question.type === 'multiple' || question.type === 'truefalse') {
                                                                    isCorrect = userAnswer === question.correct;
                                                                } else if (question.type === 'fillblank') {
                                                                    const normalizedAnswer = userAnswer ? userAnswer.toLowerCase().trim() : '';
                                                                    const normalizedCorrect = question.correct.toLowerCase();
                                                                    const correctAlternatives = question.alternatives ? 
                                                                        question.alternatives.map(alt => alt.toLowerCase()) : [];
                                                                    
                                                                    isCorrect = normalizedAnswer === normalizedCorrect || 
                                                                                correctAlternatives.includes(normalizedAnswer);
                                                                }
                                                                
                                                                return (
                                                                    <div key={qIndex} className="quiz-question">
                                                                        <p><strong>Question {qIndex + 1}:</strong> {question.q}</p>
                                                                        
                                                                        {question.type === 'multiple' && (
                                                                            <div className="quiz-options-grid">
                                                                                {question.options.map((option, optIndex) => {
                                                                                    const isSelected = userAnswer === optIndex;
                                                                                    const isCorrectOption = optIndex === question.correct;
                                                                                    
                                                                                    let className = "quiz-option";
                                                                                    if (isSelected) {
                                                                                        className += isCorrect ? " correct" : " incorrect";
                                                                                    } else if (isCorrectOption) {
                                                                                        className += " correct";
                                                                                    }
                                                                                    
                                                                                    return (
                                                                                        <div key={optIndex} className={className}>
                                                                                            {option}
                                                                                        </div>
                                                                                    );
                                                                                })}
                                                                            </div>
                                                                        )}
                                                                        
                                                                        {question.type === 'truefalse' && (
                                                                            <div className="true-false-container">
                                                                                <div className={`quiz-option ${userAnswer === true ? (isCorrect ? 'correct' : 'incorrect') : ''}`}>
                                                                                    True
                                                                                </div>
                                                                                <div className={`quiz-option ${userAnswer === false ? (isCorrect ? 'correct' : 'incorrect') : ''}`}>
                                                                                    False
                                                                                </div>
                                                                            </div>
                                                                        )}
                                                                        
                                                                        {question.type === 'fillblank' && (
                                                                            <div>
                                                                                <p>Your answer: <span className={isCorrect ? 'correct' : 'incorrect'}>{userAnswer || '(No answer provided)'}</span></p>
                                                                                <p>Correct answer: <span className="correct">{question.correct}</span></p>
                                                                            </div>
                                                                        )}
                                                                        
                                                                        <div className={`explanation ${isCorrect ? 'correct' : 'incorrect'}`}>
                                                                            {question.explanation}
                                                                        </div>
                                                                    </div>
                                                                );
                                                            })}
                                                            
                                                            <div className="navigation">
                                                                <button 
                                                                    className="btn btn-secondary" 
                                                                    onClick={retryQuiz}
                                                                >
                                                                    Retry Quiz
                                                                </button>
                                                                
                                                                <button 
                                                                    className="btn btn-primary" 
                                                                    onClick={handleNext}
                                                                    disabled={isLastLesson}
                                                                >
                                                                    {isLastLesson ? 'Finish Course' : 'Continue'}
                                                                </button>
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            )}
                                            
                                            <div className="edit-controls">
                                                <button 
                                                    className={`btn ${editMode ? 'btn-save' : 'btn-edit'}`}
                                                    onClick={editMode ? saveContent : toggleEditMode}
                                                >
                                                    {editMode ? 'Save Changes' : 'Edit Quiz'}
                                                </button>
                                                {editMode && (
                                                    <button className="btn btn-cancel" onClick={cancelEdit}>
                                                        Cancel
                                                    </button>
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                            
                            <button className="sidebar-toggle" onClick={toggleSidebar}>
                                ☰
                            </button>
                        </>
                    )}
                    
                    {/* Notification */}
                    {notification.show && (
                        <div className={`notification ${notification.type}`}>
                            {notification.message}
                        </div>
                    )}
                    
                    {/* History Modal */}
                    {showHistoryModal && (
                        <div className="modal">
                            <div className="modal-content">
                                <h3>Quiz History</h3>
                                
                                {quizHistory[lessonKey] && quizHistory[lessonKey].length > 0 ? (
                                    <div>
                                        {quizHistory[lessonKey].map((history, index) => (
                                            <div key={index} className="history-item">
                                                <p><strong>Date:</strong> {history.date}</p>
                                                <p><strong>Score:</strong> {history.score}% ({history.correct}/{history.total})</p>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <p>No quiz history available for this lesson.</p>
                                )}
                                
                                <div style={{ marginTop: '20px', textAlign: 'center' }}>
                                    <button 
                                        className="btn btn-primary" 
                                        onClick={() => setShowHistoryModal(false)}
                                    >
                                        Close
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // Add error boundary to catch React errors
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false };
            }

            static getDerivedStateFromError(error) {
                return { hasError: true };
            }

            componentDidCatch(error, errorInfo) {
                console.error("Error caught by Error Boundary:", error, errorInfo);
            }

            render() {
                if (this.state.hasError) {
                    return (
                        <div style={{ padding: '20px', color: 'red' }}>
                            <h2>Something went wrong.</h2>
                            <p>Please refresh the page and try again.</p>
                        </div>
                    );
                }

                return this.props.children;
            }
        }

        // Render the application with error boundary
        try {
            ReactDOM.render(
                <ErrorBoundary>
                    <BiologyCourse />
                </ErrorBoundary>, 
                document.getElementById('root')
            );
        } catch (error) {
            console.error('Error rendering application:', error);
            document.getElementById('root').innerHTML = 
                '<div style="color: red; padding: 20px;">Failed to initialize application. Please check the browser console for details.</div>';
        }
    </script>
</body>
</html>
